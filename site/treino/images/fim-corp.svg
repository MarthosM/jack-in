<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice">
  <!-- Jack In Treino: cena de fim de partida, vitória da Corp (arte original) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1426"/><stop offset=".65" stop-color="#16294a"/><stop offset="1" stop-color="#060c18"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7aa7ff" stop-opacity=".55"/><stop offset=".5" stop-color="#7aa7ff" stop-opacity=".14"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7aa7ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset=".6" stop-color="#ffb347" stop-opacity=".8"/><stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <circle cx="600" cy="220" r="320" fill="url(#core)"/>
  <!-- arcologia -->
  <g fill="#050b16">
    <rect x="40" y="230" width="70" height="250"/><rect x="120" y="170" width="56" height="310"/><rect x="186" y="260" width="84" height="220"/><rect x="280" y="300" width="60" height="180"/>
    <rect x="860" y="290" width="64" height="190"/><rect x="932" y="190" width="58" height="290"/><rect x="1000" y="140" width="70" height="340"/><rect x="1080" y="240" width="80" height="240"/>
  </g>
  <g fill="#9cc0ff" fill-opacity=".4">
    <rect x="132" y="190" width="8" height="4"/><rect x="150" y="214" width="8" height="4"/><rect x="132" y="250" width="8" height="4"/><rect x="200" y="282" width="8" height="4"/>
    <rect x="946" y="214" width="8" height="4"/><rect x="964" y="246" width="8" height="4"/><rect x="1016" y="164" width="8" height="4"/><rect x="1040" y="200" width="8" height="4"/><rect x="1016" y="236" width="8" height="4"/><rect x="1096" y="262" width="8" height="4"/>
  </g>
  <!-- anéis de bloqueio -->
  <g transform="translate(600 220)" fill="none" stroke="#9cc0ff">
    <circle r="190" stroke-opacity=".16" stroke-width="2" stroke-dasharray="6 10"/>
    <circle r="150" stroke-opacity=".28" stroke-width="3" stroke-dasharray="40 14"/>
    <path d="M0 -118 102 -59v118L0 118 -102 59v-118Z" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0 -78 67.5 -39v78L0 78 -67.5 39v-78Z" stroke-width="3" stroke-opacity=".75" stroke-linejoin="round"/>
    <path d="M0 -118V-176M102 -59 152 -88M-102 -59 -152 -88M102 59 152 88M-102 59 -152 88M0 118V176" stroke-opacity=".5" stroke-width="2"/>
    <g fill="#9cc0ff" stroke="none"><circle cy="-176" r="5"/><circle cx="152" cy="-88" r="5"/><circle cx="-152" cy="-88" r="5"/><circle cx="152" cy="88" r="5"/><circle cx="-152" cy="88" r="5"/><circle cy="176" r="5"/></g>
    <circle r="22" fill="#cfe0ff" stroke="none"/>
    <circle r="40" fill="#7aa7ff" fill-opacity=".25" stroke="none" filter="url(#blur)"/>
  </g>
  <!-- rastro do Runner interrompido na barreira -->
  <path d="M-20 330 C160 330 260 280 380 262" fill="none" stroke="url(#trace)" stroke-width="6" stroke-linecap="round"/>
  <path d="M-20 330 C160 330 260 280 380 262" fill="none" stroke="#ff4f6d" stroke-opacity=".3" stroke-width="18" stroke-linecap="round" filter="url(#blur)"/>
  <g fill="#ff4f6d"><path d="M392 252 l10 -4 2 10 -10 4z" fill-opacity=".8"/><path d="M404 276 l8 2 -2 8 -8 -2z" fill-opacity=".6"/><path d="M386 290 l6 4 -4 6 -6 -4z" fill-opacity=".45"/><path d="M412 240 l6 -2 2 6 -6 2z" fill-opacity=".5"/></g>
  <g fill="#7aa7ff"><rect x="60" y="80" width="200" height="2" fill-opacity=".25"/><rect x="900" y="70" width="220" height="2" fill-opacity=".25"/><rect x="760" y="420" width="160" height="2" fill-opacity=".2"/></g>
</svg>
